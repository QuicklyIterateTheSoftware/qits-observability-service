# Test-only overrides. Quarkus MERGES this file with `src/main/resources/application.properties`
# during a test run — main's copy is not shadowed, it is still in effect for every key this file
# does not set. So app-level settings (quarkus.rest.path, the non-application root path, the MCP
# root-path, body limits, the OpenAPI info) belong there and MUST NOT be re-declared here: a test
# copy that drifts from the shipped copy makes the suite lie. The tests would keep asserting
# /observability/* while the packaged process served something else, and stay green the whole way.
#
# Only put a key here if the test run genuinely needs a DIFFERENT value from what ships.
#
# No APPLICATION key does: this context owns no tables (no datasource, no Flyway, no in-memory H2 URL
# and no target/-scoped data dir to point at), the store is in-memory already, and the store's caps
# default in code (qits.telemetry.max-*). TelemetryBootstrapIT hands the LAUNCHED process everything
# it needs through its own @TestProfile — a packaged process takes its configuration as -D arguments
# and reads none of this file.
#
# The one line below is not an application key at all; see its own note.

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
#
# THE CATALOGUE RELIES ON IT. Seven story classes share one @TestProfile and therefore one launched
# process and one in-memory buffer, and TelemetryBootstrapIT has to run first: the parent stub's
# recording is cumulative with no floor, so anything the launched process posted upstream at startup
# lands in whichever story drains FIRST, and that story's assertEdgeCount is the claim that nothing
# did. The orderer sorts by fully-qualified class name — eu.wohlben.qits.telemetry.TelemetryBootstrapIT
# before eu.wohlben.qits.telemetry.stories.* — and every other story method additionally carries
# @UserflowRunsAfter(TelemetryBootstrapIT.class) so the ordering is stated rather than inferred from
# spelling. Without this line the classes would run in JUnit's own order and the dependency would be
# silently ignored rather than reported.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer
