# The application config for qits-observability as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. Keep this file to what the *process*
# owns; the telemetry buffer's caps (qits.telemetry.max-*) stay defaulted in code, where a consumer
# can still override them.
#
# Everything here was previously supplied by the monorepo's app shell
# (service/src/main/resources/application.properties, monolith-only), which is why the suite carried
# private copies in src/test/resources and the packaged app had none.

quarkus.application.name=qits-observability

# The JAX-RS prefix every qits route lives under. qits-gateway routes verbatim by prefix —
# /observability/* reaches this service, and nothing else does — so the segment is part of the path
# this process itself must serve, not something a proxy strips.
#
# This is also the one setting here that is load-bearing beyond this repo: OTel SDKs are configured
# with a LITERAL endpoint URL (OTEL_EXPORTER_OTLP_ENDPOINT=http://<host>/observability/api/otel),
# not a discovered one, and they append /v1/<signal> themselves — so ingest lands at
# /observability/api/otel/v1/*. Drop or shorten this and ingest moves somewhere the exporters are
# not pointed at, every export 404s, and nothing anywhere reports an error — the SDK's retry is
# silent and the receiver never sees the request. The suite asserts the full prefixed paths, so a
# test run would stay green either way.
quarkus.rest.path=/observability/api

# --- the SPA ------------------------------------------------------------------------------------
# Quinoa builds service/src/main/webui — the qits-spa-observability submodule — during augmentation
# and serves the bundle from this process. The UI and the API it calls are therefore one deployable
# and one origin: no CORS and no second container.
#
# SERVED AT THE ROOT. This service has a host of its own — observability.<env>.<domain> — and the
# SPA owns every path on it that the wire routes do not claim. angular.json sets baseHref "/", so
# the two sides agree by having nothing to agree about: no segment is spelled in the client at all.
#
# The segment survives in THREE keys that move together — the ignored prefix below,
# quarkus.rest.path and quarkus.http.non-application-root-path — plus `routes:` in .config/qits/deployments.yml, which is
# what tells the edge to path-route /observability/* here from every vhost. All of them are in this
# repository, and a build here can check them.
quarkus.quinoa.ui-root-path=/

# Deep links. Without this a reload of /traces is a 404 from the static handler, because only
# index.html exists on disk — the routes are the router's, resolved in the browser. It is also what
# makes the project-scoped form, /qits/traces, survive a reload.
#
# It must not swallow the API, and left alone it would: the fallback answers anything that is not a
# file on disk, so /observability/api/typo would return index.html with a 200 instead of a 404, and
# a client would parse HTML as JSON. Quinoa's ignored-path-prefixes is the exclusion list, and
# setting it REPLACES the derivation (quarkus.rest.path plus non-application-root-path) rather than
# extending it.
#
# ONE ENTRY, and it is ABSOLUTE. Values are matched after ui-root-path is stripped, and the ui root
# is "/" now, so what is written here is the path as it arrives. `/observability` is a PREFIX match,
# so it covers all three wire surfaces at once:
#
#   /observability/api     the REST surface, INCLUDING the OTLP ingest at /observability/api/otel
#   /observability/q       health, openapi and swagger-ui
#   /observability/stream  the live stream (@WebSocket, api/TelemetryStreamSocket). websockets-next
#                          claims only the upgrade, so a plain GET here would reach the SPA
#                          fallback without this entry.
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/observability

# Where the Angular CLI leaves the bundle. Stated rather than left to quinoa's framework detection
# because Angular 17+ splits its output into dist/<project>/browser (and, with SSR, server/); the
# project name is angular.json's, not this repo's module name, and detection that resolved to
# dist/ alone would package the parent directory. Moves only if angular.json's project is renamed.
quarkus.quinoa.build-dir=dist/qits-spa-observability/browser

# Nothing here disables quinoa for tests, because it already is: the extension defaults to enabled
# EXCEPT in test mode. That is what keeps AGENTS.md's rule intact on the path that matters — the
# suite still needs no node, no npm registry and no network. `mvn package` does need all three now,
# and that is the real cost of serving the UI from this process; it is a build prerequisite, not a
# test one.

# --- the API document -------------------------------------------------------------------------
# Quarkus' non-application root path: what the framework serves rather than application code. It
# sits OUTSIDE quarkus.rest.path and moves only with this key, so anything left at the root /q would
# be the SPA's ground now, and the health gate would read index.html. Served at
# /observability/q/openapi, with the browsable UI at
# /observability/q/swagger-ui — quarkus.swagger-ui.path is relative and follows on its own; do not
# pin it.
quarkus.http.non-application-root-path=/observability/q

# always-include because swagger-ui is a dev-mode-only extension by default, and the whole point of
# packaging these as processes is that each one documents its own surface in a real deployment.
#
# Note this document deliberately does NOT describe the ingest endpoints: they are an OTLP wire
# protocol for SDKs, so they are @Operation(hidden = true). The document is the JSON API a client
# generator consumes.
quarkus.smallrye-openapi.info-title=qits-observability API
quarkus.swagger-ui.always-include=true

# OTLP export bodies are batches, not requests — the monorepo raised this app-wide for the same
# reason and the ingest surface inherited it. Left at the platform default a busy exporter's batch
# is rejected at the HTTP layer, before OtelReceiverResource is ever entered.
quarkus.http.limits.max-body-size=64M

# --- a person's bearer token --------------------------------------------------------------------
# A person's command-line tool (`qits observe`, idp client `qits-cli`) reaches this service through
# the edge with that person's token. The edge removes every X-Qits-* header from a request that
# carries a Bearer or Basic credential and adds none, so forward-auth sees nothing and the request
# would be anonymous: 401 on every protected route. quarkus-oidc checks the token instead. Its
# `groups` claim becomes the identity's roles, so the same @RolesAllowed boundaries decide.
#
# In-network callers do not change. A browser session gets X-Qits-User / X-Qits-Roles from the edge
# and sends no token, and a request with no Authorization header never reaches the token check. A
# request WITH a token is decided by the token, because OIDC's mechanism runs first (priority 1001,
# forward-auth 1000): a token that does not validate is 401, headers or not.
#
# Ingest does not change either. /observability/api/otel/v1/* stays @PermitAll: exporters send no
# credential, and a request with none is never challenged.
#
# ON BY DEFAULT, so a deployment needs no config for it. It requires nothing and holds no secret; it
# only adds a way in. Off in %dev and %test, which have no idp; the security/ tests turn it back on
# (BearerAuthProfile with a local key, JwksStub with a stand-in key endpoint).
quarkus.oidc.tenant-enabled=true
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false

# Bearer only: no login flow, no session.
quarkus.oidc.application-type=service

# Reached at the idp's public edge host, like every peer (qits-1406). Discovery is on: the tenant
# reads <auth-server-url>/.well-known/openid-configuration and takes the JWKS address (`jwks_uri`)
# and the issuer from it. The fetch is anonymous, which the edge lets through.
#
# NO DEFAULT FOR QITS_DOMAIN, ON PURPOSE. qits-deployments injects it into every container; one
# started without it must refuse to boot rather than verify tokens against a guessed domain, and an
# unresolvable expansion is exactly that refusal. No environment label either: the platform project
# has none, so QITS_ENVIRONMENT never appears in a peer address. %dev and %test keep the old
# qits-net name, which only satisfies the expansion — the tenant is off in both.
quarkus.oidc.auth-server-url=https://idp.qits.${QITS_DOMAIN}/idp
%dev.quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp
%test.quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp

# THE ISSUER IS NOT CONFIGURATION. With discovery on, quarkus-oidc compares every token's `iss` to
# the `issuer` the idp publishes in its discovery document (https://idp.qits.<domain>), and refuses
# a token with any other. There is deliberately no quarkus.oidc.token.issuer line.

# FETCH KEYS WHEN A TOKEN NEEDS ONE, NEVER AT BOOT. Boot fetches no keys, so the tenant serves
# header traffic at once whether the idp is up or not. The first bearer fetches the key by the
# token's `kid`, and it is cached. BearerJwksTest pins this.
quarkus.oidc.jwks.resolve-early=false
# When the idp is down at boot, the tenant retries discovery when a request needs it. Resolve the
# idp's host name off the event loop: a resolution on the event loop was a 2.7 s blocked thread in
# qits-events' packaged ITs.
quarkus.oidc.use-blocking-dns-lookup=true

# Which tokens are for this platform. `qits-platform` is the one audience qits-idp stamps
# on every token it mints — a person's CLI token and a service's machine token alike — so a receiver
# that accepts it is addressed by every caller there is. A token carrying some other `aud`, or none,
# is 401 before any role is read.
#
# Addressing is therefore not a permission. What a caller may do here is decided by its `groups`
# against the `@RolesAllowed` boundaries, never by which service it was addressed to. Spelled as the
# literal on purpose: the audience is the platform's, not this deployment's, and it must not follow
# QITS_ENVIRONMENT or anything else a deployment sets.
quarkus.oidc.token.audience=qits-platform

# --- the live stream ----------------------------------------------------------------------------
# /observability/stream (api/TelemetryStreamSocket). The edge closes a connection that carries no
# traffic for a while, and a stream with a narrow filter can be silent for minutes. A ping every 30
# seconds keeps it open. Same value qits-platform-system uses for its terminals.
quarkus.websockets-next.server.auto-ping-interval=30S

# The per-connection frame queue (qits.telemetry.stream.queue-size, default 256) and the dispatcher
# backlog (qits.telemetry.stream.dispatch-backlog, default 1024 ingest batches) default in code,
# like the buffer caps. See control/TelemetryLiveFeed.

# --- the error-issue store (epic qits-2538) --------------------------------------------------------
# TelemetryStore is still in-memory and a restart empties it — deliberate, documented in README.md.
# Error issues are not: they are this context's first tables (domain/, V1__error_issues.sql), in a
# postgres database of its own, behind a named datasource + persistence unit + Flyway lineage.
#
# WHERE THE DATABASE COMES FROM. .config/qits/deployments.yml declares `postgresql:db`, so
# qits-deployments creates the role and the database (`qits_observability`) before the successor
# container starts and injects QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD.
#
# THE TRIPLE HAS NO DEFAULTS, AND THAT IS THE REFUSE-TO-BOOT STANCE. Unset, the expressions are
# unresolvable and a deployed process dies at Flyway's migrate-at-start naming the variable, rather
# than opening some store nobody meant. They are %prod keys so that the two other profiles can do
# without them: the suite's testdb/EmbeddedPgConfigSource supplies the triple (a zonky postgres),
# and %dev runs with no database at all (below).
quarkus.datasource.observability.db-kind=postgresql
%prod.quarkus.datasource.observability.jdbc.url=${QITS_RESOURCE_DB_URL}
%prod.quarkus.datasource.observability.username=${QITS_RESOURCE_DB_USERNAME}
%prod.quarkus.datasource.observability.password=${QITS_RESOURCE_DB_PASSWORD}

# THE POOL SURVIVES A POSTGRES CUTOVER — the platform's datasource baseline, all three lines or
# none; DatasourceBaselineTest fails the build if one goes missing. PatientPgDriver (qits-db-core)
# keeps asking for up to 14s while postgres is not there, under the 15s acquisition timeout.
quarkus.datasource.observability.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.observability.jdbc.acquisition-timeout=15S
quarkus.datasource.observability.jdbc.validate-on-borrow=true

# The persistence unit, bound to it, owning exactly the domain's entity package.
quarkus.hibernate-orm.observability.datasource=observability
quarkus.hibernate-orm.observability.packages=eu.wohlben.qits.telemetry.issues.entity

# Own Flyway lineage, hand-written and appended to. No baseline-on-migrate: every database this
# lineage meets is empty or was created by it.
quarkus.flyway.observability.migrate-at-start=true
quarkus.flyway.observability.locations=classpath:db/observability/migration

# %dev HAS NO DATABASE, AND STILL BOOTS AND INGESTS. The datasource is inactive there, and with it
# the persistence unit and Flyway (each switched off by its own key): ErrorIssueStore.active() is
# false, the aggregator holds nothing and writes nothing, and the error-issue doors answer 503. Point
# a dev run at a postgres by setting the three quarkus.datasource.observability.* keys and these
# three to true.
%dev.quarkus.datasource.observability.active=false
%dev.quarkus.hibernate-orm.observability.active=false
%dev.quarkus.flyway.observability.active=false

# NO DEV SERVICES, IN EITHER PROFILE. A clone builds and tests with no docker, and a dev service is
# a container start — which is what an unconfigured postgres datasource invites.
quarkus.devservices.enabled=false

# The aggregator (control/ErrorIssueAggregator). Every flush-interval the pending window is written
# in one transaction; at most max-pending distinct fingerprints are held per window, and the rest are
# dropped and counted (a WARN, at most once a minute — never an ERROR, which would feed this
# service's own issues). The suite calls flush() itself, so %test switches the schedule off.
qits.observability.error-issues.flush-interval=10s
qits.observability.error-issues.max-pending=1000
%test.qits.observability.error-issues.flush-interval=off

# Hour counts are kept hour-retention, then purged by an hourly job. An issue itself never expires
# (owner ruling 2026-11-22): its occurrences and first/last seen are never purged. %test calls the
# purge itself.
qits.observability.error-issues.hour-retention=P30D
qits.observability.error-issues.purge-interval=1h
%test.qits.observability.error-issues.purge-interval=off

# --- browser stacks through the release's source maps (epic qits-2689, task qits-2766) ----------
# sourcemap/SourceMapping: a browser ERROR log (service `<app>-browser`) is mapped at ingest through
# the docs site @sourcemaps/<app> at its service.version, read with this service's `qits` bearer
# (the docs wire answers an anonymous read 401). The mapped stack is stamped on the log as
# qits.error.mapped-stacktrace and becomes the issue's sample stack trace; the fingerprint is not
# changed by it (qits-2768 does that). Off under %dev and %test: neither dials the docs store.
#
# Limits: one map file at most max-map-size; decoded maps held in an LRU of cache-size; ingest
# waits at most fetch-budget per batch; the top `frames` frames, at most `files` map files per log,
# and up to `older-versions` older releases when the reported version lacks the file (a bundle the
# service worker kept from an older release). `concurrency` fetches at once.
qits.observability.sourcemaps.enabled=true
%dev.qits.observability.sourcemaps.enabled=false
%test.qits.observability.sourcemaps.enabled=false
qits.observability.sourcemaps.base-url=https://registry.qits.${QITS_DOMAIN}/artifacts/docs/docs
%dev.qits.observability.sourcemaps.base-url=http://localhost:0/artifacts/docs/docs
%test.qits.observability.sourcemaps.base-url=http://localhost:0/artifacts/docs/docs
qits.observability.sourcemaps.max-map-size=16M
qits.observability.sourcemaps.cache-size=64M
qits.observability.sourcemaps.fetch-budget=5s
qits.observability.sourcemaps.frames=10
qits.observability.sourcemaps.files=3
qits.observability.sourcemaps.older-versions=3
qits.observability.sourcemaps.concurrency=4

# --- the platform event bus (epic qits-2538, task qits-2684) ---------------------------------------
# THIS SERVICE PUBLISHES TWO EVENTS AND SUBSCRIBES TO NOTHING: control/ErrorIssueAnnouncer publishes
# ErrorIssueOpened and ErrorIssueRegressed once the flush transaction that inserted or reopened the
# issue has committed. The machinery is the published qits-eventstream jar.
#
# NOTHING THE BUS NEEDS IS SPELLED HERE, deliberately — the qits-maintenance stance. qits.events.url,
# the outbox's own datasource and Flyway lineage, its resilience baseline, the publish timeout, the
# retry budget and the sweep schedule all ship as ordinal-100 defaults in that jar, and a copy in this
# file would be a second place to change. A deployment overrides them by environment:
# QITS_RESOURCE_EVENTSTREAM_URL / _USERNAME / _PASSWORD for the outbox datasource (the platform's
# generic resource triple, from `resources: postgresql:eventstream:qits_observability_eventstream`
# in deployments.yml), and QITS_EVENTS_URL for where qits-events answers.
#
# What DOES belong here is the DARKNESS, because the library ships enabled and the deployable owns
# where it is real. A clone-alone `./mvnw verify` and a `quarkus:dev` have no qits-events on the far
# side. Off means publish() is a debug log: no request and no outbox row.
#
# DARK IS NOT ABSENT. It does not stop the DATASOURCE, which Quarkus opens and Flyway migrates at
# boot regardless — which is why the suite hands out a second database
# (testdb/EmbeddedPgConfigSource).
%dev.qits.eventstream.enabled=false
%test.qits.eventstream.enabled=false

# %dev HAS NO DATABASE, AND THE OUTBOX CANNOT BE SWITCHED OFF LIKE THE ISSUE STORE. qits-eventstream
# injects its `eventstream` persistence unit directly (ConsumedEvents), so an inactive unit fails the
# boot (InactiveBeanException) — ErrorIssuesWithoutDatabaseTest found it. So in %dev the datasource
# stays active, aimed at a local postgres nothing has to be running on, and nothing connects to it:
# Flyway does not migrate at start, Hibernate starts offline (no metadata read), and the bus is
# dark, so no publish reaches for the outbox. Point a dev run at a real one with the
# QITS_RESOURCE_EVENTSTREAM_* triple and migrate-at-start back on.
%dev.quarkus.datasource.eventstream.jdbc.url=${QITS_RESOURCE_EVENTSTREAM_URL:jdbc:postgresql://localhost:5432/qits_observability_eventstream}
%dev.quarkus.datasource.eventstream.username=${QITS_RESOURCE_EVENTSTREAM_USERNAME:qits_observability_eventstream}
%dev.quarkus.datasource.eventstream.password=${QITS_RESOURCE_EVENTSTREAM_PASSWORD:}
%dev.quarkus.flyway.eventstream.migrate-at-start=false
%dev.quarkus.hibernate-orm.eventstream.database.start-offline=true

# WHO THE BUS SAYS THIS SERVICE IS: its own `qits` OIDC client. Every call qits-eventstream makes —
# the outbox's PUT to qits-events through the edge — carries a bearer minted from it, and the edge
# answers a call without one 401. .config/qits/deployments.yml's `idp:client` has qits-deployments
# provision the client (id `dev-qits-observability`, roles qits:system) and inject
# QITS_RESOURCE_IDP_URL / _CLIENT_ID / _CLIENT_SECRET. The defaults are what the deployer would
# inject; they only decide anything where no deployer started the process, and there the secret is
# empty, so a token request is refused rather than presenting somebody else's credential. The lines
# are the library README's, the same ones qits-ci and qits-maintenance carry.
quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:https://idp.qits.${QITS_DOMAIN}/idp}
%dev.quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
%test.quarkus.oidc-client.qits.auth-server-url=${QITS_RESOURCE_IDP_URL:http://${QITS_ENVIRONMENT:dev}-qits-idp:8080/idp}
quarkus.oidc-client.qits.discovery-enabled=false
quarkus.oidc-client.qits.token-path=token
quarkus.oidc-client.qits.client-id=${QITS_RESOURCE_IDP_CLIENT_ID:dev-qits-observability}
quarkus.oidc-client.qits.credentials.secret=${QITS_RESOURCE_IDP_CLIENT_SECRET:}
quarkus.oidc-client.qits.grant.type=client
quarkus.oidc-client.qits.grant-options.client.audience=qits-platform
quarkus.oidc-client.qits.early-tokens-acquisition=false
# On wherever the deployer runs it; off under %dev and %test, so a suite or a local run never dials
# an idp. An outbox row written while it is off stays in the outbox, which is what the publish tests
# read.
quarkus.oidc-client.qits.client-enabled=true
%dev.quarkus.oidc-client.qits.client-enabled=false
%test.quarkus.oidc-client.qits.client-enabled=false

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-observability` — the deployable's name, not the module's — rather than
# qits-telemetry-<version>-runner, so `-Dnative` produces target/qits-observability and the process
# is identifiable in `ps` / `docker top` as the thing the gateway routes to. The failsafe plugin's
# native.image.path in service/pom.xml spells the same name; they move together, and if they drift
# the native IT launches nothing.
quarkus.package.output-name=qits-observability
quarkus.package.jar.add-runner-suffix=false

# --- telemetry: this service is also a sender ---------------------------------------------------
# It exports to itself, which reads odd and is deliberate. A receiver that reports nothing about
# itself is the one service whose latency, errors and restarts are invisible, and the alternative —
# a second collector — does not exist. Same key as everywhere else, so a deployment that moves the
# receiver moves this with it and self-export is simply what the default value happens to mean.
# A call to itself goes to localhost (qits-1406): it never leaves the container, needs no name
# resolution and no edge, and the receiver is this very process on its own port.
qits.observability.url=http://localhost:8080

quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. This receiver decodes all three signals,
# and a log record correlated to a trace is most of why it exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# HERE THE RECEIVER IS ALSO THE DESTINATION, so the loop the suppress line below cuts for traces has
# to be answered for logs too — and what answers it is that nothing on the ingest path logs at this
# floor. A batch of log records POSTs to this process' own /v1/logs, and handling that request emits
# no record of its own: the only two loggers in this application are OtelForwarder, which is DEBUG
# only and so below the INFO floor twice over, and TelemetryStore's metric-series cap warning, which
# latches per bucket and fires once. So an export produces no input to the next one — there is no
# feedback term, which is exactly what a server span per ingest WAS. The one record the pipeline can
# make of itself is the SDK's own "Failed to export" diagnostic, emitted only when an export already
# failed and rate-limited by OpenTelemetry's ThrottlingLogger, so a failing receiver cannot amplify
# either. The live platform shows qits-observability's self-export arriving in its own source bucket
# without a blowup.
#
# That an ordinary logger call really becomes an exported OTLP record is proven once, in qits-events:
# its OtelLogBridgeTest decodes a real ExportLogsServiceRequest and PackagedLogBridgeIT repeats the
# claim against the packaged artifact. The same extension and the same four keys run here, so this
# repo guards the configuration rather than re-proving the behaviour — OtelLogConfigTest pins these
# values so drift cannot disable log export quietly.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the UI has nothing to plot until every service
# says this.
#
# Self-export does not close the loop below. Metrics leave on a fixed interval and are aggregates,
# so the ingest request one export makes only lands in the next interval's counters: a constant
# trickle, not the self-sustaining one the suppress line exists for.
quarkus.otel.metrics.enabled=true

# THE LOOP, and the one line that cuts it. Exporting a span POSTs to this service's own ingest
# route, which is an inbound HTTP request, which produces a server span, which is exported... a
# self-sustaining trickle that never stops and drowns real telemetry in the receiver's own
# plumbing. Suppressing the three ingest uris removes exactly those server spans and nothing else:
# the query surface and everything a reader cares about still trace normally.
#
# Traces only, and that is enough — log records are not emitted per export, so the logs signal does
# not close the same circle.
quarkus.otel.traces.suppress-application-uris=/observability/api/otel/v1/traces,/observability/api/otel/v1/logs,/observability/api/otel/v1/metrics

# Dark outside a deployment, as everywhere else.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
