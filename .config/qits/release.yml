archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-observability, sbom: .sbom/sbom.json }
# The provider golden masters (epic qits-546, ticket qits-1149): the platform packages
# `golden-masters/` as `eu.wohlben.qits:qits-observability-golden-masters` and
# `@qits/observability-golden-masters`, each published only when its content changed.
# `contracts/GoldenMasterRecordingTest` records them.
contracts:
  application: qits-observability
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  # The entity exposure map EntityExposureTest keeps current (qits-1945; this service's first tables
  # are epic qits-2538's error issues), bundled as entities.json in @contracts/qits-observability by
  # contract-docs.
  entities: docs/entities.json
  # The ER diagrams `qits database diagram` keeps current (qits-2014), bundled under database/
  # with an index in @contracts/<application> by contract-docs.
  database: docs/database/
  # The consumer pacts this service writes (ticket qits-1149): IdpConsumerPactTest writes
  # pacts/qits-observability-service_qits-idp-service.json.
  pacts:
    # Three-part: pacts/qits-observability-service_qits-eventstream-javalib_qits-events-service.json
    # (qits-2684), what the qits-eventstream library asks qits-events on this service's behalf — the
    # outbox's publish — written by contracts/EventstreamPactTest from the library's kit.
    qits-events-service: { packages: [maven] }
    qits-idp-service: { packages: [maven] }
userflows: qits-observability
